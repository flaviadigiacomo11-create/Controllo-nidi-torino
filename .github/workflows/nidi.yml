name: Test Connessione Comune Torino

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Informazioni rete
        run: |
          echo "=== DATA ==="
          date -u

          echo "=== DNS ==="
          getent ahosts www.comune.torino.it || true

          echo "=== IP PUBBLICO RUNNER ==="
          curl -s --max-time 15 https://api.ipify.org
          echo

      - name: Test HTTPS IPv4
        run: |
          curl -4 -v -L \
            --connect-timeout 20 \
            --max-time 40 \
            -o /dev/null \
            -w "\nHTTP STATUS: %{http_code}\nREMOTE IP: %{remote_ip}\n" \
            "https://www.comune.torino.it/schede-informative/graduatoria-nidi-dinfanzia-comunali-convenzione-sezioni-primavera-convenzione" \
            || true

      - name: Test HTTPS IPv6
        run: |
          curl -6 -v -L \
            --connect-timeout 20 \
            --max-time 40 \
            -o /dev/null \
            -w "\nHTTP STATUS: %{http_code}\nREMOTE IP: %{remote_ip}\n" \
            "https://www.comune.torino.it/schede-informative/graduatoria-nidi-dinfanzia-comunali-convenzione-sezioni-primavera-convenzione" \
            || true

name: Controllo Nidi Torino

on:
  schedule:
    - cron: '27 12 * * 2'

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Diagnostica connessione
        continue-on-error: true
        run: |
          echo "===== TEST GOOGLE ====="
          curl -I -v --connect-timeout 15 --max-time 25 https://www.google.com/ || true

          echo "===== TEST COMUNE HTTPS ====="
          curl -I -v --connect-timeout 15 --max-time 25 https://www.comune.torino.it/ || true

          echo "===== TEST COMUNE HTTP ====="
          curl -I -v --connect-timeout 15 --max-time 25 http://www.comune.torino.it/ || true

      - run: python controllo_nidi.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
